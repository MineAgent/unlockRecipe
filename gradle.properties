# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` entry.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.17.21
# Only these Fabric API modules are used:
# net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents and
# net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents.
# The same versions ship inside fabric-api-0.166.2+26.3.
fabric_networking_version=6.4.1+c58129785d
fabric_lifecycle_version=4.1.9+ffef5f675d

# Mod Properties
version=1.0.1
group=com.example
archives_base_name=unlockrecipe
